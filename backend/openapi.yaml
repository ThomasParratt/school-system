                  $ref: "#/components/schemas/Language"
                level:
                  $ref: "#/components/schemas/Level"
                material:
                  $ref: "#/components/schemas/NonEmptyString"
                instructorId:
                  $ref: "#/components/schemas/Id"

      responses:
