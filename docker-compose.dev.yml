services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  
  db_test:
    image: postgres:15
    container_name: postgres_test_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_test
    ports:
      - "5433:5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    container_name: backend_app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./backend:/repo/backend      # mirrors host code into container
      - ./packages:/repo/packages    # the shared packages, read from source
      # keep the container's installs instead of the host's
      - /repo/backend/node_modules
      - /repo/packages/contracts/node_modules
      - /repo/packages/domain/node_modules
    depends_on:
      db:
        condition: service_healthy
  
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    container_name: frontend_app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/repo/frontend
      - ./packages:/repo/packages
      - /repo/frontend/node_modules
      - /repo/packages/contracts/node_modules
      - /repo/packages/domain/node_modules
    depends_on:
      - backend

volumes:
  postgres_data: